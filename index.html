<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alveoli Team Quiz</title>
<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#021526,#03346E,#6EACDA);
color:white;
text-align:center;
overflow-x:hidden;
}

.screen{
padding:20px;
display:none;
}

.active{
display:block;
}

.card{
background:rgba(255,255,255,0.12);
backdrop-filter:blur(10px);
padding:20px;
border-radius:25px;
margin:20px auto;
max-width:1000px;
box-shadow:0 0 25px rgba(0,0,0,0.5);
}

button{
padding:12px 22px;
border:none;
border-radius:15px;
background:#00C2FF;
color:white;
font-size:18px;
margin:10px;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.08);
background:#00E5FF;
}

#wheel{
width:450px;
height:450px;
border-radius:50%;
margin:auto;
border:12px solid white;
position:relative;
overflow:hidden;
transition:transform 5s ease-out;
}

.slice{
position:absolute;
width:50%;
height:50%;
transform-origin:100% 100%;
left:0;
top:0;
clip-path:polygon(0 0,100% 0,100% 100%);
}

.pointer{
width:0;
height:0;
border-left:25px solid transparent;
border-right:25px solid transparent;
border-top:50px solid gold;
margin:auto;
}

.team-box{
display:inline-block;
vertical-align:top;
background:#ffffff22;
padding:15px;
margin:15px;
border-radius:20px;
min-width:250px;
}

.player{
padding:10px;
margin:5px;
background:#ffffff22;
border-radius:10px;
}

.timer{
font-size:40px;
color:gold;
margin:20px;
}

.question{
font-size:28px;
margin:20px;
}

.answer-btn{
display:block;
width:70%;
margin:10px auto;
}

.winner{
font-size:55px;
animation:pulse 1s infinite;
}

@keyframes pulse{
0%{transform:scale(1)}
50%{transform:scale(1.08)}
100%{transform:scale(1)}
}
</style>
</head>
<body>

<div id="start" class="screen active">
<div class="card">
<h1>🫁 Alveoli Quiz Game</h1>
<h2>Select Number of Teams</h2>
<button onclick="chooseTeams(2)">2 Teams</button>
<button onclick="chooseTeams(3)">3 Teams</button>
</div>
</div>

<div id="spinnerScreen" class="screen">
<div class="card">
<h1>🎡 Spin The Wheel</h1>
<div class="pointer"></div>
<div id="wheel"></div>
<br>
<button onclick="spinWheel()">SPIN</button>
<h2 id="selectedName"></h2>
</div>
</div>

<div id="teamsScreen" class="screen">
<div class="card">
<h1>👥 Teams</h1>
<div id="teamsContainer"></div>
<button onclick="startQuiz()">Done</button>
</div>
</div>

<div id="quizScreen" class="screen">
<div class="card">
<h1 id="teamTurn"></h1>
<h2 id="difficulty"></h2>
<h2 id="points"></h2>
<div class="timer" id="timer"></div>
<div class="question" id="question"></div>
<div id="answers"></div>
<button onclick="showAnswer()">Show Answer</button>
<button onclick="correctAnswer()">Correct</button>
<button onclick="wrongAnswer()">Wrong</button>
<h2 id="realAnswer"></h2>
<div id="scoreboard"></div>
</div>
</div>

<!-- BONUS SCREEN -->
<div id="bonusScreen" class="screen">
  <div class="card">
    <h1>🔥 BONUS QUESTION</h1>
    <div class="timer" id="bonusTimer"></div>
    <div class="question" id="bonusQuestion"></div>
    <h2 id="bonusAnswer" style="display:none;"></h2>
    <button onclick="showBonusAnswer()">Show Answer</button>
    <button onclick="giveBonus(0)">Team 1 Correct</button>
    <button onclick="giveBonus(1)">Team 2 Correct</button>
    <button id="team3bonus" onclick="giveBonus(2)">Team 3 Correct</button>
  </div>
</div>

<script>
function showBonus(){
  showScreen('bonusScreen');
  const bonus = { q:'What process allows gas exchange?', a:'Diffusion' };
  bonusQuestion.innerHTML = bonus.q;
  bonusAnswer.innerHTML = 'Answer: ' + bonus.a;
  bonusAnswer.style.display = "none"; // hide initially
  let t = 30;
  bonusTimer.innerHTML = t;
  let x = setInterval(()=>{
    t--;
    bonusTimer.innerHTML = t;
    if(t<=0) clearInterval(x);
  },1000);
  if(teamCount===2){
    document.getElementById('team3bonus').style.display='none';
  }
}
function showBonusAnswer(){
  document.getElementById("bonusAnswer").style.display = "block";
}
</script>

<div id="winnerScreen" class="screen">
<div class="card">
<div class="winner" id="winnerText"></div>
<div id="finalScores"></div>
</div>
</div>

<script>

const names=["Hassan","Yassin","Youssef","Abdelrahman","Lojina","Salma","Hana","Rokaya","Jwayria"];

let teamCount=2;
let teams=[];
let scores=[];
let currentQuestion=0;
let currentTeam=0;
let spinIndex=0;
let assigned=[];
let timer;

const colors=["#FF6B6B","#4ECDC4","#FFD93D","#6BCB77","#4D96FF","#FF8FAB","#C77DFF","#F28482","#84A59D"];

const questionSets={
2:[
{q:"What are alveoli?",a:"Tiny air sacs",choices:["Bones","Tiny air sacs","Muscles","Cells"],p:10,t:10,d:"Easy"},
{q:"Where are alveoli found?",a:"Lungs",choices:["Heart","Lungs","Kidney","Skin"],p:10,t:10,d:"Easy"},
{q:"Which gas enters blood?",a:"Oxygen",choices:["Nitrogen","Oxygen","CO2","Argon"],p:10,t:10,d:"Easy"},
{q:"What surrounds alveoli?",a:"Capillaries",choices:["Bones","Capillaries","Hair","Skin"],p:10,t:10,d:"Easy"},
{q:"What process allows gas exchange?",a:"Diffusion",choices:["Digestion","Diffusion","Eating","Thinking"],p:20,t:20,d:"Medium"},
{q:"What damages alveoli?",a:"Smoking",choices:["Exercise","Smoking","Water","Food"],p:20,t:20,d:"Medium"},
{q:"What carries oxygen?",a:"Hemoglobin",choices:["Water","Hemoglobin","Bones","Muscles"],p:20,t:20,d:"Medium"},
{q:"What disease fills alveoli with fluid?",a:"Pneumonia",choices:["Cancer","Pneumonia","Diabetes","Cold"],p:20,t:20,d:"Medium"},
{q:"Why do alveoli have thin walls?",a:"Fast diffusion",choices:["Decoration","Fast diffusion","Protection","Movement"],p:30,t:30,d:"Hard"},
{q:"Why are alveoli important?",a:"Gas exchange",choices:["Gas exchange","Movement","Digestion","Sleep"],p:30,t:30,d:"Hard"}
],
3:[
{q:"What are alveoli?",a:"Tiny air sacs",choices:["Bones","Tiny air sacs","Muscles","Cells"],p:10,t:10,d:"Easy"},
{q:"Where are alveoli found?",a:"Lungs",choices:["Heart","Lungs","Kidney","Skin"],p:10,t:10,d:"Easy"},
{q:"Which gas enters blood?",a:"Oxygen",choices:["Nitrogen","Oxygen","CO2","Argon"],p:10,t:10,d:"Easy"},
{q:"What surrounds alveoli?",a:"Capillaries",choices:["Bones","Capillaries","Hair","Skin"],p:20,t:20,d:"Medium"},
{q:"What process allows gas exchange?",a:"Diffusion",choices:["Digestion","Diffusion","Eating","Thinking"],p:20,t:20,d:"Medium"},
{q:"What damages alveoli?",a:"Smoking",choices:["Exercise","Smoking","Water","Food"],p:20,t:20,d:"Medium"},
{q:"Why do alveoli have thin walls?",a:"Fast diffusion",choices:["Decoration","Fast diffusion","Protection","Movement"],p:30,t:30,d:"Hard"},
{q:"Why are alveoli important?",a:"Gas exchange",choices:["Gas exchange","Movement","Digestion","Sleep"],p:30,t:30,d:"Hard"},
{q:"How many alveoli do humans have?",a:"300 million",choices:["300","3000","300 million","3 million"],p:30,t:30,d:"Hard"}
]
};

function chooseTeams(n){
teamCount=n;
teams=[];
scores=[];
assigned=[];
for(let i=0;i<n;i++){
teams.push({name:`Team ${i+1}`,players:[]});
scores.push(0);
}
createWheel();
showScreen('spinnerScreen');
}

function createWheel(){
const wheel=document.getElementById('wheel');
wheel.innerHTML='';
const angle=360/names.length;

names.forEach((name,i)=>{
const slice=document.createElement('div');
slice.className='slice';
slice.style.background=colors[i];
slice.style.transform=`rotate(${i*angle}deg) skewY(${90-angle}deg)`;
slice.innerHTML=`<span style="position:absolute;right:20px;top:20px;font-size:14px;transform:skewY(-${90-angle}deg) rotate(${angle/2}deg)">${name}</span>`;
wheel.appendChild(slice);
});
}

function spinWheel(){
if(assigned.length>=names.length){
showTeams();
return;
}

let remaining=names.filter(n=>!assigned.includes(n));
let selected=remaining[Math.floor(Math.random()*remaining.length)];
assigned.push(selected);

const wheel=document.getElementById('wheel');
const rotation=3600+Math.random()*360;
wheel.style.transform=`rotate(${rotation}deg)`;

setTimeout(()=>{
document.getElementById('selectedName').innerHTML=`${selected} assigned!`;
let smallest=teams.reduce((a,b)=>a.players.length<=b.players.length?a:b);
smallest.players.push(selected);

if(assigned.length===names.length){
setTimeout(showTeams,1500);
}
},5000);
}

function showTeams(){
showScreen('teamsScreen');
const container=document.getElementById('teamsContainer');
container.innerHTML='';

teams.forEach((team,index)=>{
let div=document.createElement('div');
div.className='team-box';

let html=`<input value="${team.name}" onchange="changeTeamName(${index},this.value)"><br><br>`;

team.players.forEach((p,i)=>{
html+=`<div class='player'>${p}<br>
<button onclick="movePlayer(${index},${i})">Move</button>
<button onclick="removePlayer(${index},${i})">Delete</button>
</div>`;
});

html+=`<button onclick="addPlayer(${index})">Add Player</button>`;

div.innerHTML=html;
container.appendChild(div);
});
}

function changeTeamName(index,val){teams[index].name=val;}

function movePlayer(teamIndex,playerIndex){
let target=prompt('Move to team number:');
if(!target)return;
target=parseInt(target)-1;
if(target>=0 && target<teamCount){
let p=teams[teamIndex].players.splice(playerIndex,1)[0];
teams[target].players.push(p);
showTeams();
}
}

function removePlayer(teamIndex,playerIndex){
teams[teamIndex].players.splice(playerIndex,1);
showTeams();
}

function addPlayer(teamIndex){
let name=prompt('Player name');
if(name){
teams[teamIndex].players.push(name);
showTeams();
}
}

function startQuiz(){
showScreen('quizScreen');
showQuestion();
}

function showQuestion(){
const qs=questionSets[teamCount];

if(currentQuestion>=qs.length){
checkWinner();
return;
}

const q=qs[currentQuestion];
currentTeam=currentQuestion%teamCount;

teamTurn.innerHTML=`🎯 ${teams[currentTeam].name} Turn`;
difficulty.innerHTML=`Difficulty: ${q.d}`;
points.innerHTML=`Points: ${q.p}`;
question.innerHTML=q.q;
realAnswer.innerHTML='';

answers.innerHTML='';
q.choices.forEach(c=>{
let btn=document.createElement('button');
btn.className='answer-btn';
btn.innerHTML=c;
answers.appendChild(btn);
});

startTimer(q.t);
updateScores();
}

function startTimer(sec){
clearInterval(timer);
let time=sec;
document.getElementById('timer').innerHTML=time;

 timer=setInterval(()=>{
time--;
document.getElementById('timer').innerHTML=time;
if(time<=0){clearInterval(timer);}
},1000);
}

function showAnswer(){
const q=questionSets[teamCount][currentQuestion];
realAnswer.innerHTML='✅ Answer: '+q.a;
}

function correctAnswer(){
const q=questionSets[teamCount][currentQuestion];
scores[currentTeam]+=q.p;
nextQuestion();
}

function wrongAnswer(){
nextQuestion();
}

function nextQuestion(){
currentQuestion++;
showQuestion();
}

function updateScores(){
let html='';
for(let i=0;i<teamCount;i++){
html+=`<h2>${teams[i].name}: ${scores[i]} pts</h2>`;
}
scoreboard.innerHTML=html;
}

function checkWinner(){
let max=Math.max(...scores);
let winners=[];

scores.forEach((s,i)=>{
if(s===max) winners.push(i);
});

if(winners.length>1){
showBonus();
}else{
showWinner(winners[0]);
}
}

function showBonus(){
showScreen('bonusScreen');
const bonus={
q:'What process allows gas exchange?',
a:'Diffusion'
};

bonusQuestion.innerHTML=bonus.q;
bonusAnswer.innerHTML='Answer: '+bonus.a;

let t=30;
bonusTimer.innerHTML=t;

let x=setInterval(()=>{
t--;
bonusTimer.innerHTML=t;
if(t<=0) clearInterval(x);
},1000);

if(teamCount===2){
document.getElementById('team3bonus').style.display='none';
}
}

function giveBonus(team){
scores[team]+=20;
let max=Math.max(...scores);
showWinner(scores.indexOf(max));
}

function showWinner(index){
showScreen('winnerScreen');

winnerText.innerHTML=`👑 ${teams[index].name} WINNERS 👑`;

let html='';

scores.forEach((s,i)=>{
html+=`<h2>${teams[i].name}: ${s} pts</h2>`;
});

finalScores.innerHTML=html;
}

function showScreen(id){
document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
document.getElementById(id).classList.add('active');
}

</script>
</body>
</html>
